<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-20px) scale(1.15);opacity:.8}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.particle{animation:floatParticle 6s ease-in-out infinite}.particle-delayed{animation:floatParticle 8s ease-in-out infinite 2s}.glowing-orb{animation:pulseGlow 5s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:12,12;animation:dashMove 15s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="140" fill="#38bdf8" class="glowing-orb" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="280" r="160" fill="#c084fc" class="glowing-orb" filter="url(#glow)" opacity=".15"/><g opacity=".15"><path fill="none" stroke="url(#accentGrad)" stroke-width="3" d="M -50 100 Q 300 200 600 80 T 1250 220" class="flow-line"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M -50 250 Q 400 60 800 280 T 1250 100" class="flow-line"/></g><g opacity=".25"><circle cx="220" cy="260" r="6" fill="#38bdf8" class="particle"/><circle cx="940" cy="90" r="8" fill="#c084fc" class="particle-delayed"/><circle cx="1100" cy="180" r="5" fill="#818cf8" class="particle"/><circle cx="120" cy="190" r="7" fill="#38bdf8" class="particle-delayed"/></g><rect width="1080" height="280" x="60" y="40" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".1" stroke-width="1.5" rx="16"/><rect width="1080" height="5" x="60" y="40" fill="url(#accentGrad)" rx="2"/><g><g transform="translate(100, 0) translate(0, 75)"><rect width="250" height="32" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="14" y="21" fill="#38bdf8" class="badge-text">DATA PREPARATION TOOLKIT</text></g><text x="0" y="160" class="title" transform="translate(100, 0)">Awesome Visual Data Preparation</text><text x="0" y="200" class="subtitle" transform="translate(100, 0)">A Curated Ecosystem of No-Code Data Wrangling, Visual ETL &amp; Self-Hosted Pipelines</text><g><g transform="translate(100, 0) translate(0, 240) translate(0, 0)"><rect width="180" height="32" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="14" y="21" class="badge-text">10+ Enterprise SaaS</text></g><g transform="translate(100, 0) translate(0, 240) translate(195, 0)"><rect width="195" height="32" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="14" y="21" class="badge-text">15+ Open-Source Engines</text></g><g transform="translate(100, 0) translate(0, 240) translate(405, 0)"><rect width="180" height="32" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="14" y="21" class="badge-text">Star History Included</text></g></g></g></svg>