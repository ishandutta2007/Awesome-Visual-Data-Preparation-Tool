<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }

    /* CSS Keyframe Animations */
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-20px) scale(1.15); opacity: 0.8; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }

    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }

    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .particle-delayed { animation: floatParticle 8s ease-in-out infinite 2s; }
    .glowing-orb { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
    .flow-line { stroke-dasharray: 12, 12; animation: dashMove 15s linear infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <circle class="glowing-orb" cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
  <circle class="glowing-orb" cx="1050" cy="280" r="160" fill="#c084fc" opacity="0.15" filter="url(#glow)"/>

  <!-- Background Data Grid / Flow Lines -->
  <g opacity="0.15">
    <path class="flow-line" d="M -50 100 Q 300 200 600 80 T 1250 220" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <path class="flow-line" d="M -50 250 Q 400 60 800 280 T 1250 100" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Decorative Animated Flow Pipeline Nodes -->
  <g opacity="0.25">
    <circle class="particle" cx="220" cy="260" r="6" fill="#38bdf8"/>
    <circle class="particle-delayed" cx="940" cy="90" r="8" fill="#c084fc"/>
    <circle class="particle" cx="1100" cy="180" r="5" fill="#818cf8"/>
    <circle class="particle-delayed" cx="120" cy="190" r="7" fill="#38bdf8"/>
  </g>

  <!-- Central Foreground Content Card Container -->
  <rect x="60" y="40" width="1080" height="280" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="60" y="40" width="1080" height="5" rx="2" fill="url(#accentGrad)"/>

  <!-- FOREGROUND TEXT & HEADINGS -->
  <g transform="translate(100, 0)">
    <!-- Header Pill / Tag -->
    <g transform="translate(0, 75)">
      <rect width="250" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="21" class="badge-text" fill="#38bdf8">DATA PREPARATION TOOLKIT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title">Awesome Visual Data Preparation</text>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">A Curated Ecosystem of No-Code Data Wrangling, Visual ETL &amp; Self-Hosted Pipelines</text>

    <!-- Pill Badges at Bottom -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="14" y="21" class="badge-text">10+ Enterprise SaaS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="195" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="14" y="21" class="badge-text">15+ Open-Source Engines</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(405, 0)">
        <rect width="180" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="14" y="21" class="badge-text">Star History Included</text>
      </g>
    </g>
  </g>
</svg>
